<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Validation - Secure Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </div>
      <h1 class="auth-title">User Validation</h1>
      <p class="auth-subtitle">Database Authentication System</p>
    </div>

    <!-- Dynamic Alerts / Failure Message -->
    <div id="alertContainer" style="display: none;"></div>

    <!-- Login Form -->
    <form id="loginForm" action="/login" method="POST">
      <div class="form-group">
        <label for="username" class="form-label">Login Name / Username</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            placeholder="Enter your login name"
            required
            autocomplete="username"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
          <button type="button" class="toggle-password" id="togglePassword" title="Show/Hide Password" aria-label="Toggle password visibility">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-primary">
        <span>Authenticate & Login</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <!-- Quick Demo Credentials Box for Evaluation -->
    <div class="demo-box">
      <div class="demo-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        Click to autofill sample database users:
      </div>
      <div class="demo-chips">
        <button type="button" class="demo-chip" data-user="admin" data-pass="Admin@123">admin (Admin@123)</button>
        <button type="button" class="demo-chip" data-user="john_doe" data-pass="Password123!">john_doe (Password123!)</button>
        <button type="button" class="demo-chip" data-user="alice" data-pass="AlicePass#2026">alice (AlicePass#2026)</button>
      </div>
    </div>

    <div class="auth-footer">
      Don't have an account in the database? <a href="/register">Register here</a>
    </div>
  </div>

  <footer class="footer-credit">
    Web Programming Lab 11 &bull; Server-Side Database Authentication System
  </footer>

  <script src="/js/login.js"></script>
</body>
</html>
