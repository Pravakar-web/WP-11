<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Database User Creation</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-icon" style="background: linear-gradient(135deg, #10b981, #06b6d4);">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
      </div>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Add a New User into Database</p>
    </div>

    <!-- Error/Success Display -->
    <div id="registerAlert" style="display: none;"></div>

    <form id="registerForm" action="/register" method="POST">
      <div class="form-group">
        <label for="reg-username" class="form-label">Desired Login Name</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </span>
          <input type="text" id="reg-username" name="username" class="form-input" placeholder="e.g. alex_coder" required minlength="3">
        </div>
      </div>

      <div class="form-group">
        <label for="reg-fullname" class="form-label">Full Name</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </span>
          <input type="text" id="reg-fullname" name="full_name" class="form-input" placeholder="e.g. Alex Johnson" required>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-email" class="form-label">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          </span>
          <input type="email" id="reg-email" name="email" class="form-input" placeholder="alex@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-password" class="form-label">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </span>
          <input type="password" id="reg-password" name="password" class="form-input" placeholder="Choose a secure password" required minlength="6">
        </div>
      </div>

      <div class="form-group">
        <label for="reg-role" class="form-label">Role</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          </span>
          <input type="text" id="reg-role" name="role" class="form-input" placeholder="e.g. QA Engineer / Analyst" value="Standard User">
        </div>
      </div>

      <button type="submit" class="btn-primary" style="background: linear-gradient(135deg, #10b981, #059669);">
        <span>Save to Database & Register</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Sign in here</a>
    </div>
  </div>

  <footer class="footer-credit">
    Web Programming Lab 11 &bull; Server-Side Database Authentication System
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const err = urlParams.get('error');
    if (err) {
      const container = document.getElementById('registerAlert');
      container.innerHTML = `
        <div class="alert alert-danger">
          <span class="alert-icon">&#9888;</span>
          <div>${decodeURIComponent(err)}</div>
        </div>
      `;
      container.style.display = 'block';
    }
  </script>
</body>
</html>
